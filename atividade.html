    <title>Comp<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparação de Valores</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px 0;
        }
        td {
            border: 1px solid #ccc;
            padding: 4px 8px;
            text-align: center;
        }
        input[type="number"] {
            width: 150px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <table>
        <!-- Linha 1: Igual (==) -->
        <tr>
            <td><input type="number" id="v1_1"></td>
            <td>==</td>
            <td><input type="number" id="v2_1"></td>
            <td><button onclick="comparar(1, '==')">Comparar</button></td>
        </tr>
        <!-- Linha 2: Diferente (!=) -->
        <tr>
            <td><input type="number" id="v1_2"></td>
            <td>!=</td>
            <td><input type="number" id="v2_2"></td>
            <td><button onclick="comparar(2, '!=')">Comparar</button></td>
        </tr>
        <!-- Linha 3: Maior (>) -->
        <tr>
            <td><input type="number" id="v1_3"></td>
            <td>&gt;</td>
            <td><input type="number" id="v2_3"></td>
            <td><button onclick="comparar(3, '>')">Comparar</button></td>
        </tr>
        <!-- Linha 4: Maior ou Igual (>=) -->
        <tr>
            <td><input type="number" id="v1_4"></td>
            <td>&gt;=</td>
            <td><input type="number" id="v2_4"></td>
            <td><button onclick="comparar(4, '>=')">Comparar</button></td>
        </tr>
        <!-- Linha 5: Menor (<) -->
        <tr>
            <td><input type="number" id="v1_5"></td>
            <td>&lt;</td>
            <td><input type="number" id="v2_5"></td>
            <td><button onclick="comparar(5, '<')">Comparar</button></td>
        </tr>
        <!-- Linha 6: Menor ou Igual (<=) -->
        <tr>
            <td><input type="number" id="v1_6"></td>
            <td>&lt;=</td>
            <td><input type="number" id="v2_6"></td>
            <td><button onclick="comparar(6, '<=')">Comparar</button></td>
        </tr>
    </table>

    <script>
        function comparar(linha, operador) {
            // Obtém os valores dos inputs baseados na linha clicada
            const val1 = parseFloat(document.getElementById(`v1_${linha}`).value);
            const val2 = parseFloat(document.getElementById(`v2_${linha}`).value);

            // Verifica se ambos os campos foram preenchidos
            if (isNaN(val1) || !document.getElementById(`v2_${linha}`).value) {
                alert("Por favor, digite ambos os valores para comparar.");
                return;
            }

            let resultado = false;

            // Avalia a expressão com base no operador correto
            switch (operador) {
                case '==':  resultado = (val1 == val2); break;
                case '!=':  resultado = (val1 != val2); break;
                case '>':   resultado = (val1 > val2); break;
                case '>=':  resultado = (val1 >= val2); break;
                case '<':   resultado = (val1 < val2); break;
                case '<=':  resultado = (val1 <= val2); break;
            }

            // Exibe o alerta com a resposta formatada
            alert(resultado ? "VERDADEIRO" : "FALSO");
        }
    </script>

</body>
</html>
