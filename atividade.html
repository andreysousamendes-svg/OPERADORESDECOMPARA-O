<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - Comparadores</title>
    <style>
        table {
            border-collapse: collapse;
        }
        td {
            border: 1px solid #ccc;
            padding: 4px;
            text-align: center;
        }
        input[type="number"] {
            width: 80px;
        }
    </style>
</head>
<body>

    <table>
        <!-- Linha do Igual (==) -->
        <tr>
            <td><input type="number" id="v1_eq"></td>
            <td>==</td>
            <td><input type="number" id="v2_eq"></td>
            <td><button onclick="comparar('eq')">Comparar</button></td>
        </tr>
        <!-- Linha do Diferente (!=) -->
        <tr>
            <td><input type="number" id="v1_dif"></td>
            <td>!=</td>
            <td><input type="number" id="v2_dif"></td>
            <td><button onclick="comparar('dif')">Comparar</button></td>
        </tr>
        <!-- Linha do Maior (>) -->
        <tr>
            <td><input type="number" id="v1_mai"></td>
            <td>&gt;</td>
            <td><input type="number" id="v2_mai"></td>
            <td><button onclick="comparar('mai')">Comparar</button></td>
        </tr>
        <!-- Linha do Menor (<) -->
        <tr>
            <td><input type="number" id="v1_men"></td>
            <td>&lt;</td>
            <td><input type="number" id="v2_men"></td>
            <td><button onclick="comparar('men')">Comparar</button></td>
        </tr>
        <!-- Linha do Maior ou Igual (>=) -->
        <tr>
            <td><input type="number" id="v1_maieq"></td>
            <td>&gt;=</td>
            <td><input type="number" id="v2_maieq"></td>
            <td><button onclick="comparar('maieq')">Comparar</button></td>
        </tr>
        <!-- Linha do Menor ou Igual (<=) -->
        <tr>
            <td><input type="number" id="v1_meneq"></td>
            <td>&lt;=</td>
            <td><input type="number" id="v2_meneq"></td>
            <td><button onclick="comparar('meneq')">Comparar</button></td>
        </tr>
    </table>

    <script>
        function comparar(operacao) {
            let n1 = parseFloat(document.getElementById('v1_' + operacao).value);
            let n2 = parseFloat(document.getElementById('v2_' + operacao).value);
            
            // Validação simples caso o usuário deixe em branco
            if (isNaN(n1) || !isNaN(n2) === false) {
                alert("Por favor, digite ambos os valores.");
                return;
            }

            let resultado;

            switch(operacao) {
                case 'eq':    resultado = (n1 == n2); break;
                case 'dif':   resultado = (n1 != n2); break;
                case 'mai':   resultado = (n1 > n2); break;
                case 'men':   resultado = (n1 < n2); break;
                case 'maieq': resultado = (n1 >= n2); break;
                case 'meneq': resultado = (n1 <= n2); break;
            }

            // Exibe VERDAEIRO ou FALSO em caixa de alert
            alert(resultado ? "VERDADEIRO" : "FALSO");
        }
    </script>

</body>
</html>
